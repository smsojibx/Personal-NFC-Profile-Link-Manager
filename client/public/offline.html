<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>No connection — S M Sujauddula Sojib</title>
    <meta name="theme-color" content="#f8fbfe" />
    <style>
      :root {
        --ink: #1a2f42;
        --ink-2: #4a6279;
        --blue: #1a7fc1;
        --line: rgba(14, 42, 71, 0.14);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 40px 22px;
        color: var(--ink);
        font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
        -webkit-font-smoothing: antialiased;
        background:
          radial-gradient(58vw 46vw at 80% 4%, rgba(26, 127, 193, 0.14), transparent 70%),
          radial-gradient(48vw 44vw at 6% 90%, rgba(76, 195, 234, 0.15), transparent 72%),
          linear-gradient(180deg, #ffffff 0%, #fbfdfe 55%, #f7fafc 100%);
      }
      .wrap { width: min(520px, 100%); display: grid; justify-items: center; gap: 13px; }
      .mark {
        width: 40px; height: 40px; border-radius: 50%;
        display: grid; place-items: center; margin-bottom: 14px;
        background: linear-gradient(150deg, #17456e, #081d33);
        color: #fff;
        box-shadow: 0 10px 18px -12px rgba(8, 29, 51, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.28);
      }
      .mark svg { width: 22px; height: 22px; }
      .code {
        margin: 0; font-family: ui-monospace, "SFMono-Regular", monospace;
        font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--blue);
      }
      h1 {
        margin: 0; font-family: "Sora", system-ui, sans-serif;
        font-size: clamp(28px, 6vw, 40px); line-height: 1.08; letter-spacing: -0.035em;
      }
      p { margin: 0; max-width: 40ch; color: var(--ink-2); font-size: 14.5px; line-height: 1.62; }
      .actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 10px; }
      button, a {
        appearance: none; display: inline-flex; align-items: center; justify-content: center;
        height: 46px; padding: 0 20px; border-radius: 14px;
        font: inherit; font-family: "Sora", system-ui, sans-serif; font-size: 13px; font-weight: 500;
        text-decoration: none; cursor: pointer; border: 1px solid transparent;
      }
      .primary {
        color: #fff;
        background: linear-gradient(155deg, #1b4f7c 0%, #123a5e 55%, #0a2440 100%);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22), 0 16px 26px -18px rgba(8, 29, 51, 0.7);
      }
      .ghost { border-color: var(--line); background: rgba(255, 255, 255, 0.7); color: var(--ink); }
      .status { font-size: 12px; color: var(--ink-2); min-height: 1.2em; }
    </style>
  </head>
  <body>
    <main class="wrap">
      <div class="mark" aria-hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
          <path d="M7 8.5a6 6 0 0 1 0 7" opacity=".55" />
          <path d="M10.5 6a10 10 0 0 1 0 12" opacity=".8" />
          <path d="M14 3.5a14 14 0 0 1 0 17" />
        </svg>
      </div>
      <p class="code">Offline</p>
      <h1>No connection right now.</h1>
      <p>
        The card needs the network to load your links. Turn on Wi-Fi or mobile data — it will come
        back on its own the moment you're connected.
      </p>
      <div class="actions">
        <button class="primary" type="button" onclick="location.reload()">Try again</button>
        <a class="ghost" href="mailto:hello@smsojib.com">Email me instead</a>
      </div>
      <p class="status" id="status"></p>
    </main>
    <script>
      var status = document.getElementById("status");
      function update() {
        status.textContent = navigator.onLine ? "Connection is back — reloading…" : "";
        if (navigator.onLine) setTimeout(function () { location.reload(); }, 600);
      }
      window.addEventListener("online", update);
      update();
    </script>
  </body>
</html>
